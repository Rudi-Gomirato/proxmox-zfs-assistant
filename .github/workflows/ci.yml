name: Tests and Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Installer without Python Launcher
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          env = os.environ.copy()
          env['PATH'] = os.pathsep.join([str(Path(sys.executable).parent), str(Path(os.environ['WINDIR'])/'System32'), os.environ['WINDIR']])
          subprocess.run(['cmd.exe', '/c', 'installa.cmd'], input='\n', text=True, env=env, check=True, timeout=240)
          subprocess.run([str(Path('.venv/Scripts/python.exe')), '-c', 'import PySide6.QtCore, paramiko'], check=True)

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_windows.py
      - name: Smoke test packaged application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $application = Start-Process -FilePath "$PWD/dist/ProxmoxZfsAssistant/ProxmoxZfsAssistant.exe" -ArgumentList @('--data-dir', "$PWD/test-output/ci-app", '--screenshot', "$PWD/test-output/ci-demo.png") -WindowStyle Hidden -PassThru
          if (-not $application.WaitForExit(30000)) {
            Stop-Process -Id $application.Id -Force
            throw 'Packaged application startup timed out'
          }
          if ($application.ExitCode -ne 0 -or -not (Test-Path "$PWD/test-output/ci-demo.png")) {
            throw 'Packaged application demo did not start'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ProxmoxZfsAssistant-Windows
          path: |
            dist/ProxmoxZfsAssistant-Windows.zip
            dist/SHA256SUMS.txt
