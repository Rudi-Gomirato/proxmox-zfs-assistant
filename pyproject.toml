[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-zfs-assistant"
version = "0.1.0"
description = "Windows desktop assistant for Proxmox ZFS disk diagnosis and replacement"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rudi Gomirato"}]
license = {text = "MIT"}
dependencies = ["PySide6-Essentials>=6.7,<7", "paramiko>=3.5,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.gui-scripts]
pve-disk-assistant = "pve_disk_assistant.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pve_disk_assistant = ["resources/*.pyz"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

